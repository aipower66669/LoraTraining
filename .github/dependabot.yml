version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      electron-vite:
        patterns:
          - electron
          - electron-*
          - vite
          - '@vitejs/*'
      eslint-typescript:
        patterns:
          - eslint*
          - '@typescript-eslint/*'
          - typescript
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@uiw/react-codemirror'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
