name: Release

# Windows NSIS installer on version tags only. Branch and pull-request pushes
# are covered by check.yml and do not publish an installer.
#
# Valid tags: vX.Y.Z only (e.g. v0.4.0). The tag must match package.json.
# This workflow does not rewrite the version.

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  release:
    name: Windows installer → GitHub Release
    needs: check
    # Tag pushes only. check.yml covers branches; there is no manual dispatch build.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Require tag to match package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version '$version' must be X.Y.Z"
          }
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag '$env:GITHUB_REF_NAME' must be $expected so the installer version matches the tag. This workflow does not rewrite package.json."
          }
          Write-Host "Tag $expected matches package.json"

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        env:
          # No code-signing cert in CI. signExecutable is also false in package.json.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:nobump

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "LoraTraining Setup *.exe" | Select-Object -First 1
          if (-not $exe) { throw "No Setup exe found under release/" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLowerInvariant()
          $line = "$hash  $($exe.Name)"
          Set-Content -Path "release/SHA256SUMS.txt" -Value $line -Encoding ascii
          Write-Host $line

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          name: LoraTraining ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release/LoraTraining Setup *.exe
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
