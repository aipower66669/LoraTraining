name: Release

# One workflow, version tags only. A push or pull request does not run this.
# Valid tags: vX.Y.Z matching package.json (e.g. v0.4.0). The version is not rewritten.

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Require tag to match package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version '$version' must be X.Y.Z"
          }
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag '$env:GITHUB_REF_NAME' must be $expected so the installer version matches the tag. This workflow does not rewrite package.json."
          }
          Write-Host "Tag $expected matches package.json"

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:nobump

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "LoraTraining Setup *.exe" | Select-Object -First 1
          if (-not $exe) { throw "No Setup exe found under release/" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLowerInvariant()
          $line = "$hash  $($exe.Name)"
          Set-Content -Path "release/SHA256SUMS.txt" -Value $line -Encoding ascii
          Write-Host $line

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          name: LoraTraining ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release/LoraTraining Setup *.exe
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
