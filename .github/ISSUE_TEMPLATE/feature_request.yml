name: Feature request
description: Propose a product or workflow improvement
title: '[feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome. Scope note: **Krea 2 text-to-image LoRA** dataset management + orchestration — not a built-in trainer, not a turnkey ComfyUI packager.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work in the UI / library / queue?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Datasets / captions
        - Jobs / queue
        - Comfy validation / previews
        - Settings / tools
        - Installer / updates
        - Docs
        - Other
    validations:
      required: true
